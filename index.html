<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tower Defense</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<div id="ui-container" style="position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; font-size: 20px;">
        <div id="score">Score: 0</div>
        <div id="health">Health: 1/1</div>
    </div>
    <div id="game-over-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; text-align: center; color: white; font-family: sans-serif;">
        <div>
            <h1>Game Over</h1>
            <p>Dein Score: <span id="final-score">0</span></p>
            <hr>
            <h3>Upgrades</h3>
            <p>Bonus-Punkte: <span id="bonus-points">0</span></p>
            <button id="upgrade-health-button" style="margin-bottom: 10px;">Upgrade Health (Kosten: 100)</button>
            <button id="upgrade-autoshoot-button" style="margin-bottom: 10px;">Enable Auto-Shoot (Kosten: 250)</button>
            <hr>
            <button id="restart-button">Neustart</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js",
                "three/addons/loaders/MTLLoader.js": "./loaders/MTLLoader.js",
                "three/addons/loaders/OBJLoader.js": "./loaders/OBJLoader.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
