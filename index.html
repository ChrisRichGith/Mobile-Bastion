<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tower Defense</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<div id="ui-container" style="position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; font-size: 20px; background-color: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 8px; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
        <div id="score">Score: 0</div>
        <div id="health">Health: 1/1</div>
    </div>
    <div id="game-over-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; text-align: center; color: white; font-family: sans-serif;">
        <div>
            <h1>Game Over</h1>
            <p>Dein Score: <span id="final-score">0</span></p>
            <hr>
            <h3>Upgrades</h3>
            <p>Bonus-Punkte: <span id="bonus-points">0</span></p>
            <div id="upgrades-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: 20px auto; padding: 20px; background-color: rgba(0,0,0,0.3); border-radius: 10px;">
                <!-- Turm Upgrades -->
                <div style="padding: 15px; border: 1px solid #666; border-radius: 8px; background-color: rgba(255,255,255,0.1);">
                    <h4>Turm-Upgrades</h4>
                    <p>Health: <span id="health-stat">1</span></p>
                    <button id="upgrade-health-button">Upgrade Health (<span id="health-cost">100</span>)</button>
                    <p>Bewegungstempo: <span id="player-speed-stat">0.1</span></p>
                    <button id="upgrade-player-speed-button">Upgrade (<span id="player-speed-cost">80</span>)</button>
                    <p>Kugel-Geschwindigkeit: <span id="bullet-speed-stat">0.2</span></p>
                    <button id="upgrade-bullet-speed-button">Upgrade (<span id="bullet-speed-cost">120</span>)</button>
                    <p>Kugelschaden: <span id="bullet-damage-stat">1</span></p>
                    <button id="upgrade-bullet-damage-button">Upgrade (<span id="bullet-damage-cost">200</span>)</button>
                </div>
                <!-- Auto-Shoot Upgrades -->
                <div style="padding: 15px; border: 1px solid #666; border-radius: 8px; background-color: rgba(255,255,255,0.1);">
                    <h4>Auto-Shoot</h4>
                    <div id="autoshoot-enable-container">
                        <button id="upgrade-autoshoot-button">Enable Auto-Shoot (<span id="autoshoot-enable-cost">250</span>)</button>
                    </div>
                    <div id="autoshoot-upgrades-container" style="display: none;">
                        <p>Feuerrate: <span id="firerate-stat">1</span>/s</p>
                        <button id="upgrade-firerate-button">Upgrade (<span id="firerate-cost">150</span>)</button>
                        <p>Reichweite: <span id="range-stat">10</span></p>
                        <button id="upgrade-range-button">Upgrade (<span id="range-cost">150</span>)</button>
                    </div>
                </div>
                <!-- Gegner Debuffs -->
                <div style="padding: 15px; border: 1px solid #666; border-radius: 8px; background-color: rgba(255,255,255,0.1);">
                    <h4>Gegner-Debuffs</h4>
                    <p>Gegner-Tempo: <span id="enemy-speed-stat">100</span>%</p>
                    <button id="downgrade-enemy-speed-button">Verlangsamen (<span id="enemy-speed-cost">200</span>)</button>
                    <p>Spawn-Rate: <span id="spawn-rate-stat">100</span>%</p>
                    <button id="downgrade-spawn-rate-button">Verlangsamen (<span id="spawn-rate-cost">300</span>)</button>
                </div>
            </div>
            <hr>
            <button id="restart-button">Neustart</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js",
                "three/addons/loaders/MTLLoader.js": "./loaders/MTLLoader.js",
                "three/addons/loaders/OBJLoader.js": "./loaders/OBJLoader.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
